# Typecheck, tests and Python-parity for the TypeScript backend on every PR and push to main.
name: backend
on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      # Actions are pinned to commit SHAs (tags noted) so a moved tag cannot change CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # node:sqlite (ledger race test) needs Node 22.13+.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # The provider-contract suite runs in its own job, which fetches the pinned specs.
      - run: bunx vitest run
        env:
          CROWBO_CONTRACTS: skip
      - run: bun scripts/parity.ts
      - run: bunx wrangler deploy --dry-run --outdir .wrangler/dry
  contracts:
    # Connectors against the pinned provider specs (backend/contracts/SOURCES.md). A provider that
    # changed its spec fails here, not in the main suite.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/contracts.ts
      - run: bunx vitest run test/contracts
