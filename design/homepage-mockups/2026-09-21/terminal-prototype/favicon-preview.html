<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>crowbo / favicon sizes</title>
  <link rel="icon" href="../assets/crowbo-circuit-favicon-v3.png" type="image/png">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10101b;color:#f3e9d5;padding:40px;font:14px/1.6 ui-monospace,monospace}main{max-width:760px;margin:auto}h1{font-size:26px;font-weight:400;color:#a4edc3}p{max-width:60ch;color:#9595a6}section{padding:24px;border:1px solid #363746;margin:24px 0}h2{margin:0 0 24px;font-size:12px;font-weight:400}.sizes{display:flex;align-items:start;gap:40px;flex-wrap:wrap}figure{margin:0;min-width:55px}figcaption{font-size:11px;margin-top:12px}.light{background:#f3e9d5;color:#28243e;border-color:#f3e9d5}img{display:block}a{color:#a4edc3}a:focus-visible{outline:2px solid #eef34b;outline-offset:4px}@media(max-width:480px){body{padding:20px}.sizes{gap:24px}section{padding:20px}}
  </style>
</head>
<body>
<main>
  <h1>crowbo / favicon</h1>
  <p>Circuit Frames V3 at actual display sizes. Lemon gate-shaped glasses and the mint feather edge carry the small icon. The browser scales the simplified head artwork.</p>
  <section aria-labelledby="dark-title">
    <h2 id="dark-title">ON DARK</h2>
    <div class="sizes">
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="16" height="16" alt="Circuit Frames V3 favicon at 16 pixels"><figcaption>16 × 16</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="32" height="32" alt="Circuit Frames V3 favicon at 32 pixels"><figcaption>32 × 32</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="48" height="48" alt="Circuit Frames V3 favicon at 48 pixels"><figcaption>48 × 48</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="128" height="128" alt="Circuit Frames V3 favicon at 128 pixels"><figcaption>128 × 128</figcaption></figure>
    </div>
  </section>
  <section class="light" aria-labelledby="light-title">
    <h2 id="light-title">ON LIGHT</h2>
    <div class="sizes">
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="16" height="16" alt="Circuit Frames V3 favicon at 16 pixels on a light surface"><figcaption>16 × 16</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="32" height="32" alt="Circuit Frames V3 favicon at 32 pixels on a light surface"><figcaption>32 × 32</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="48" height="48" alt="Circuit Frames V3 favicon at 48 pixels on a light surface"><figcaption>48 × 48</figcaption></figure>
      <figure><img src="../assets/crowbo-circuit-favicon-v3.png" width="128" height="128" alt="Circuit Frames V3 favicon at 128 pixels on a light surface"><figcaption>128 × 128</figcaption></figure>
    </div>
  </section>
  <a href="./">← back to the terminal prototype</a>
</main>
</body>
</html>
