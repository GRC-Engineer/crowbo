[project]
name = "crowbo"
version = "0.1.0"
description = "Source-grounded security evidence preparation and retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "turbopuffer>=1,<2",
    "mcp>=2,<3",
]

[project.scripts]
crowbo = "crowbo.cli:main"
crowbo-mcp = "crowbo.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/crowbo"]
